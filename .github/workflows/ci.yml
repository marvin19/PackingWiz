name: CI

on:
  push:
    branches:
      - main
      - rebuild/expo-app
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check app
        run: npx tsc --noEmit

      - name: Type check tests
        run: npm run test:typecheck

      - name: Lint
        run: npx eslint src

      - name: MP invariant harness
        run: npm run verify:mp1

      - name: Unit tests
        run: npm test
